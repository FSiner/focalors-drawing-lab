<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const D2R=Math.PI/180, rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
/* ---------- 벡터 ---------- */
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], mul=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2], cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]), norm=a=>{const l=len(a)||1;return[a[0]/l,a[1]/l,a[2]/l]};
function rotAxis(v,ax,ang){ax=norm(ax);const c=Math.cos(ang),s=Math.sin(ang);return add(add(mul(v,c),mul(cross(ax,v),s)),mul(ax,dot(ax,v)*(1-c)))}
const rotX=(v,a)=>rotAxis(v,[1,0,0],a), rotY=(v,a)=>rotAxis(v,[0,1,0],a), rotZ=(v,a)=>rotAxis(v,[0,0,1],a);
/* 방향(위팔/허벅지): swing=아래로부터 각, az=0 바깥 / 90 앞 / -90 뒤 */
function dirFrom(sw,az,side){sw*=D2R;az*=D2R;return[Math.sin(sw)*Math.cos(az)*side,-Math.cos(sw),Math.sin(sw)*Math.sin(az)]}
/* 관절 굽힘: dir을 target 쪽으로 b도 꺾음 (퇴화 시 fallback) */
function bendDir(dir,b,target,fallback){let t=sub(target,mul(dir,dot(dir,target)));if(len(t)<.2)t=sub(fallback,mul(dir,dot(dir,fallback)));t=norm(t);b*=D2R;return norm(add(mul(dir,Math.cos(b)),mul(t,Math.sin(b))))}

/* ---------- 포즈 ---------- */
const P0=()=>({bend:0,lean:0,twist:0,ptw:0,hy:0,hp:0,hr:0,aL:[10,0,10],aR:[10,0,10],lL:[3,0,0],lR:[3,0,0]});
const PRESETS={
 stand:()=>({...P0()}),
 walk:()=>({...P0(),twist:14,ptw:-8,hy:-6,aL:[28,-90,22],aR:[28,90,26],lL:[22,90,4],lR:[20,-90,22]}),
 run:()=>({...P0(),bend:16,twist:-16,ptw:12,hp:-8,aL:[55,90,105],aR:[50,-90,95],lL:[60,90,12],lR:[42,-90,105]}),
 sit:()=>({...P0(),bend:8,aL:[20,60,60],aR:[20,60,60],lL:[88,70,88],lR:[88,95,92]}),
 jump:()=>({...P0(),bend:-6,aL:[155,10,15],aR:[150,0,25],lL:[35,90,75],lR:[20,-60,95]}),
 reach:()=>({...P0(),bend:10,lean:-8,twist:22,hy:25,aL:[85,95,8],aR:[40,-30,60],lL:[10,0,0],lR:[26,-70,20]})
};
function randomPose(){
 const sup=Math.random()<.5, free=sup?'lR':'lL', hold=sup?'lL':'lR';
 const p={bend:rnd(-8,32),lean:rnd(-16,16),twist:rnd(-38,38),ptw:rnd(-20,20),hy:rnd(-40,40),hp:rnd(-22,26),hr:rnd(-14,14)};
 p.aL=[rnd(5,150),rnd(-50,110),rnd(0,125)];p.aR=[rnd(5,150),rnd(-50,110),rnd(0,125)];
 p[hold]=[rnd(0,14),rnd(-30,60),rnd(0,20)];
 p[free]=[rnd(8,75),rnd(-80,90),rnd(0,Math.random()<.35?110:35)];
 return p}

/* ---------- FK ---------- */
function build(p){
 const T=v=>rotY(rotZ(rotX(v,p.bend*D2R),p.lean*D2R),p.twist*D2R), Rp=v=>rotY(v,p.ptw*D2R);
 const Hd=v=>T(rotZ(rotX(rotY(v,p.hy*D2R),p.hp*D2R),p.hr*D2R));
 const J={pelvis:[0,0,0]};
 J.neck=T([0,2.35,0]);J.head=add(J.neck,Hd([0,.65,0]));J.nose=add(J.head,Hd([0,-.03,.52]));
 J.shL=T([1,2.1,0]);J.shR=T([-1,2.1,0]);J.wL=T([.62,.95,0]);J.wR=T([-.62,.95,0]);
 [['L',1,p.aL],['R',-1,p.aR]].forEach(([n,sd,a])=>{
  const sh=J['sh'+n],u=dirFrom(a[0],a[1],sd);J['el'+n]=add(sh,T(mul(u,1.35)));
  const f=bendDir(u,a[2],[0,0,1],[0,1,0]);J['wr'+n]=add(J['el'+n],T(mul(f,1.1)));J['hn'+n]=add(J['wr'+n],T(mul(f,.75)))});
 [['L',1,p.lL],['R',-1,p.lR]].forEach(([n,sd,a])=>{
  const hip=Rp([sd*.55,-.1,0]);J['hp'+n]=hip;const u=dirFrom(a[0],a[1],sd);J['kn'+n]=add(hip,Rp(mul(u,1.95)));
  const s=bendDir(u,a[2],[0,0,-1],[0,-1,0]);J['an'+n]=add(J['kn'+n],Rp(mul(s,1.85)));
  let fw=Rp([0,0,1]);let n2=sub(fw,mul(s,dot(s,fw)));if(len(n2)<.2)n2=[0,1,0];n2=norm(n2);
  J['to'+n]=add(J['an'+n],Rp(mul(norm(add(mul(s,.3),n2)),.95)))});
 let gy=Math.min(J.anL[1],J.anR[1],J.toL[1],J.toR[1])-.18;
 for(const k in J)J[k]=[J[k][0],J[k][1]-gy,J[k][2]];
 return J}

/* ---------- 카메라/렌더 ---------- */
const Cam={yaw:18,pitch:8,zoom:1};
const CAMS={front:[0,6],side:[90,6],back:[180,6],high:[20,42],low:[20,-32]};
const COLS={L:[110,170,255],R:[255,160,110],B:[205,205,220],H:[232,232,242]};
function renderMan(cv,sil){
 const W=cv.width,H=cv.height,x=cv.getContext('2d');x.clearRect(0,0,W,H);
 const J=Pose.J;if(!J)return null;
 const tgt=[(J.hpL[0]+J.hpR[0])/2,3.7,(J.hpL[2]+J.hpR[2])/2];const Dd=14,f=H*.84/7.6*Dd*Cam.zoom;
 const pr=p=>{let q=sub(p,tgt);q=rotX(rotY(q,Cam.yaw*D2R),Cam.pitch*D2R);const d=Dd-q[2];const s=f/Math.max(.5,d);return{x:W/2+q[0]*s,y:H*.5-q[1]*s,d,s}};
 const Q={};for(const k in J)Q[k]=pr(J[k]);
 if(!sil){x.strokeStyle='rgba(180,190,220,.16)';x.lineWidth=1;x.beginPath();
  for(let i=-8;i<=8;i+=2){let a=pr([i,0,-8]),b=pr([i,0,8]);x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);a=pr([-8,0,i]);b=pr([8,0,i]);x.moveTo(a.x,a.y);x.lineTo(b.x,b.y)}x.stroke()}
 const pr3=[];const cap=(a,b,ra,rb,c)=>pr3.push({t:'c',a:Q[a],b:Q[b],ra,rb,c,d:(Q[a].d+Q[b].d)/2});
 const poly=(ks,c,th)=>pr3.push({t:'p',pts:ks.map(k=>Q[k]),c,th,d:ks.reduce((s,k)=>s+Q[k].d,0)/ks.length});
 poly(['shL','shR','wR','wL'],'B',.5);poly(['wL','wR','hpR','hpL'],'B',.5);cap('pelvis','neck',.5,.4,'B');cap('neck','head',.17,.17,'B');
 pr3.push({t:'s',a:Q.head,r:.5,c:'H',d:Q.head.d});
 ['L','R'].forEach(n=>{cap('sh'+n,'el'+n,.22,.19,n);cap('el'+n,'wr'+n,.19,.15,n);cap('wr'+n,'hn'+n,.15,.1,n);
  cap('hp'+n,'kn'+n,.36,.27,n);cap('kn'+n,'an'+n,.26,.18,n);cap('an'+n,'to'+n,.17,.13,n);
  pr3.push({t:'s',a:Q['sh'+n],r:.26,c:n,d:Q['sh'+n].d});pr3.push({t:'s',a:Q['kn'+n],r:.25,c:n,d:Q['kn'+n].d})});
 pr3.sort((a,b)=>b.d-a.d);
 let dmin=1e9,dmax=-1e9;pr3.forEach(o=>{dmin=Math.min(dmin,o.d);dmax=Math.max(dmax,o.d)});
 const col=(c,d)=>{if(sil)return'#000';const k=.62+.38*(1-(d-dmin)/Math.max(.01,dmax-dmin));const b=COLS[c];return`rgb(${b[0]*k|0},${b[1]*k|0},${b[2]*k|0})`};
 pr3.forEach(o=>{const c=col(o.c,o.d);x.fillStyle=c;x.strokeStyle=sil?'#000':'rgba(0,0,0,.35)';x.lineWidth=sil?0:1;
  if(o.t==='s'){x.beginPath();x.arc(o.a.x,o.a.y,o.r*o.a.s,0,7);x.fill();if(!sil)x.stroke()}
  else if(o.t==='c'){const A=o.a,B=o.b,ra=o.ra*A.s,rb=o.rb*B.s;let dx=B.x-A.x,dy=B.y-A.y,l=Math.hypot(dx,dy)||1;const nx=-dy/l,ny=dx/l;
   x.beginPath();x.arc(A.x,A.y,ra,0,7);x.arc(B.x,B.y,rb,0,7);x.fill();x.beginPath();x.moveTo(A.x+nx*ra,A.y+ny*ra);x.lineTo(B.x+nx*rb,B.y+ny*rb);x.lineTo(B.x-nx*rb,B.y-ny*rb);x.lineTo(A.x-nx*ra,A.y-ny*ra);x.closePath();x.fill()}
  else{x.beginPath();o.pts.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.closePath();x.fill();x.lineJoin='round';x.lineWidth=o.th*o.pts[0].s;x.strokeStyle=c;x.stroke()}});
 if(!sil){const hd=Q.head,ns=Q.nose;if(ns.d<hd.d){x.fillStyle='#ff4f8b';x.beginPath();x.arc(ns.x,ns.y,Math.max(2,.09*ns.s),0,7);x.fill()}}
 return Q}

/* ---------- 창 관리 ---------- */
const wins=['fmModel','fmMan','fmFb'];
function winInit(id){const w=$('#'+id),th=w.querySelector('.th');let dr=null;
 th.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=w.getBoundingClientRect();dr={dx:e.clientX-r.left,dy:e.clientY-r.top};th.setPointerCapture(e.pointerId);w.style.zIndex=32;wins.forEach(o=>{if(o!==id)$('#'+o).style.zIndex=30})});
 th.addEventListener('pointermove',e=>{if(!dr)return;w.style.right='auto';w.style.left=Math.max(0,Math.min(innerWidth-80,e.clientX-dr.dx))+'px';w.style.top=Math.max(0,Math.min(innerHeight-40,e.clientY-dr.dy))+'px'});
 th.addEventListener('pointerup',()=>dr=null);
 w.querySelector('[data-close]').onclick=()=>{w.classList.remove('show');btnSync()}}
wins.forEach(winInit);

/* ---------- 헤더 버튼 ---------- */
const hb=[['bnMan','🧊','3D 포즈 마네킹'],['bnModel','🖼','캐릭터 원본 창'],['bnTimer','⏱','크로키 타이머'],['bnFb','🤖','AI 스케치 피드백']];
const st=$('#status');hb.forEach(([id,e,t])=>{const b=document.createElement('button');b.className='ib';b.id=id;b.title=t;b.innerHTML='<span class="hpx">'+e+'</span>';st.parentNode.insertBefore(b,st)});
const sep=document.createElement('div');sep.className='sep';$('#bnMan').before(sep);
const toggle=(el,on)=>{el.classList.toggle('show',on===undefined?!el.classList.contains('show'):on);btnSync()};
function btnSync(){$('#bnMan').classList.toggle('on',$('#fmMan').classList.contains('show'));$('#bnModel').classList.toggle('on',$('#fmModel').classList.contains('show'));
 $('#bnTimer').classList.toggle('on',$('#fpTimer').classList.contains('show'));$('#bnFb').classList.toggle('on',$('#fmFb').classList.contains('show'));if(typeof fitMan==='function')fitMan()}
$('#bnMan').onclick=()=>toggle($('#fmMan'));$('#bnModel').onclick=()=>toggle($('#fmModel'));$('#bnTimer').onclick=()=>toggle($('#fpTimer'));$('#bnFb').onclick=()=>toggle($('#fmFb'));$('#fpX').onclick=()=>{stopTimer();toggle($('#fpTimer'),false)};

/* ---------- 마네킹 뷰어 ---------- */
const Pose={p:PRESETS.stand(),J:null};Pose.J=build(Pose.p);
const mc=$('#fmManC');let manFlip=false;
function fitMan(){const r=mc.parentNode.getBoundingClientRect();const w=Math.max(10,Math.round(r.width)),h=Math.max(10,Math.round(r.height));if(mc.width!==w||mc.height!==h){mc.width=w;mc.height=h}drawMan()}
function drawMan(){if($('#fmMan').classList.contains('show'))renderMan(mc,false)}
new ResizeObserver(fitMan).observe($('#fmMan'));
function setPose(p){Pose.p=p;Pose.J=build(p);drawMan()}
$('#mnRand').onclick=()=>{setPose(randomPose());$('#mnPreset').value=''};
$('#mnPreset').onchange=e=>{if(e.target.value)setPose(PRESETS[e.target.value]())};
$('#mnView').onchange=e=>{const v=e.target.value;if(v==='rand'){Cam.yaw=rnd(-180,180);Cam.pitch=rnd(-35,50)}else if(CAMS[v]){Cam.yaw=CAMS[v][0];Cam.pitch=CAMS[v][1]}e.target.value='';drawMan()};
function flipMan(){manFlip=!manFlip;mc.style.transform=manFlip?'scaleX(-1)':'';$('#mnFlip').classList.toggle('on',manFlip)}
$('#mnFlip').onclick=flipMan;
const fl=(btn,els,css)=>{$(btn).onclick=()=>{$(btn).classList.toggle('on');applyFilt()}};
function applyFilt(){const g=$('#mnGray').classList.contains('on'),b=$('#mnBlur').classList.contains('on');mc.style.filter=(g?'grayscale(1) ':'')+(b?'blur(3px)':'')||'';
 const g2=$('#mdGray').classList.contains('on'),b2=$('#mdBlur').classList.contains('on');$('#mdImg').style.filter=(g2?'grayscale(1) ':'')+(b2?'blur(3px)':'')||''}
['#mnGray','#mnBlur','#mdGray','#mdBlur'].forEach(b=>$(b).onclick=()=>{$(b).classList.toggle('on');applyFilt()});
let orb=null;
mc.addEventListener('pointerdown',e=>{orb={x:e.clientX,y:e.clientY};mc.setPointerCapture(e.pointerId);mc.style.cursor='grabbing'});
mc.addEventListener('pointermove',e=>{if(!orb)return;const dx=(e.clientX-orb.x)*(manFlip?-1:1),dy=e.clientY-orb.y;orb={x:e.clientX,y:e.clientY};Cam.yaw+=dx*.5;Cam.pitch=Math.max(-80,Math.min(80,Cam.pitch+dy*.4));drawMan()});
mc.addEventListener('pointerup',()=>{orb=null;mc.style.cursor='grab'});
mc.addEventListener('wheel',e=>{e.preventDefault();Cam.zoom=Math.max(.4,Math.min(3,Cam.zoom*(e.deltaY<0?1.1:.91)));drawMan()},{passive:false});
mc.addEventListener('dblclick',()=>{Cam.yaw=18;Cam.pitch=8;Cam.zoom=1;drawMan()});
document.addEventListener('keydown',e=>{if(e.shiftKey&&e.key.toLowerCase()==='m'&&!/INPUT|SELECT|TEXTAREA/.test((e.target||{}).tagName||'')){e.preventDefault();e.stopImmediatePropagation();flipMan();toast('참조 마네킹 좌우반전')}},true);

/* ---------- 모델 시트 ---------- */
const mdImg=$('#mdImg'),mdEmpty=$('#fmMdEmpty');let mdFlip=false;
function setModel(url,save){mdImg.src=url;mdEmpty.style.display=url?'none':'grid';mdImg.style.display=url?'block':'none';if(save){try{url?localStorage.setItem('fpr.model',url):localStorage.removeItem('fpr.model')}catch(e){toast('원본 이미지가 커서 저장되지 않았어요 (이번 세션만 유지)')}}}
function loadModelFile(f){if(!f||!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);setModel(c.toDataURL('image/jpeg',.88),true)};im.src=r.result};r.readAsDataURL(f)}
$('#mdLoad').onclick=()=>$('#mdFile').click();$('#mdFile').onchange=e=>{loadModelFile(e.target.files[0]);e.target.value=''};
$('#mdClear').onclick=()=>setModel('',true);
$('#mdFlip').onclick=()=>{mdFlip=!mdFlip;mdImg.style.transform=mdFlip?'scaleX(-1)':'';$('#mdFlip').classList.toggle('on',mdFlip)};
const mb=$('#mdBody');['dragover','drop'].forEach(ev=>mb.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();if(ev==='drop')loadModelFile(e.dataTransfer.files[0])}));
try{const m=localStorage.getItem('fpr.model');setModel(m||'',false)}catch(e){setModel('',false)}

/* ---------- 크로키 타이머 ---------- */
let tmr=null,tEnd=0,tSec=0,ac=null;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.ceil(s%60)%60).padStart(2,'0');
function beep(n){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=i===n-1?1040:760;o.connect(g);g.connect(ac.destination);const t=ac.currentTime+i*.22;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.start(t);o.stop(t+.2)}}catch(e){}}
function stopTimer(){clearInterval(tmr);tmr=null;$('#fpTime').textContent='00:00';$('#fpTime').classList.remove('low');document.querySelectorAll('#fpTimer [data-sec]').forEach(b=>b.classList.remove('on'));setStatus('')}
function startTimer(sec){stopTimer();tSec=sec;tEnd=Date.now()+sec*1000;
 document.querySelectorAll('#fpTimer [data-sec]').forEach(b=>b.classList.toggle('on',+b.dataset.sec===sec));
 if($('#fpAuto').checked){setPose(randomPose());$('#mnPreset').value='';if(!$('#fmMan').classList.contains('show'))toggle($('#fmMan'),true)}
 beep(1);tmr=setInterval(()=>{const left=(tEnd-Date.now())/1000;if(left<=0){stopTimer();beep(3);toast('⏱ 시간 종료!');if($('#fpNext').checked)setTimeout(()=>startTimer(tSec),1200);return}
  const t=$('#fpTime');t.textContent=fmt(left);t.classList.toggle('low',left<=5);setStatus('크로키 '+fmt(left))},200)}
document.querySelectorAll('#fpTimer [data-sec]').forEach(b=>b.onclick=()=>startTimer(+b.dataset.sec));$('#fpStop').onclick=stopTimer;

/* ---------- AI 스케치 피드백 (로컬 실루엣 분석) ---------- */
const AN=4,FB={on:false,ghost:true,bones:true,g:null};
function inkOf(layers){const w=Math.ceil(S.W/AN),h=Math.ceil(S.H/AN),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=true;layers.forEach(L=>x.drawImage(L.c,0,0,w,h));
 const d=x.getImageData(0,0,w,h).data,m=new Uint8Array(w*h);let x0=w,y0=h,x1=-1,y1=-1,n=0;
 for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(d[(j*w+i)*4+3]>12){m[j*w+i]=1;n++;if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}
 return{m,w,h,x0,y0,x1,y1,n}}
function extents(m,w,box,N){const E=[];for(let r=0;r<N;r++){const y=Math.min(box.y1,Math.round(box.y0+(box.y1-box.y0)*r/(N-1)));let l=-1,rr=-1;for(let i=box.x0;i<=box.x1;i++)if(m[y*w+i]){if(l<0)l=i;rr=i}E.push(l<0?null:[l,rr])}return E}
function band(E,t0,t1,N,hh){t0=Math.max(0,Math.round(t0*(N-1)));t1=Math.min(N-1,Math.round(t1*(N-1)));let L=1e9,R=-1e9,ws=0,n=0,cs=0;for(let i=t0;i<=t1;i++){const e=E[i];if(!e)continue;L=Math.min(L,e[0]);R=Math.max(R,e[1]);ws+=e[1]-e[0];cs+=(e[0]+e[1])/2;n++}
 return n?{L,R,w:(R-L)/hh,mw:ws/n/hh,c:cs/n,n}:null}
function topInk(m,w,xa,xb,ya,yb){for(let j=Math.max(0,Math.round(ya));j<=yb;j++)for(let i=Math.max(0,Math.round(xa));i<=xb;i++)if(m[j*w+i])return j;return null}
function analyze(){
 const R=[],mk=(sev,txt,t)=>R.push({sev,txt,t});
 let layers=[S.layers[S.active]];let ink=inkOf(layers);
 if(ink.n<30){const rest=S.layers.filter((L,i)=>i>0&&L.visible);if(rest.length){layers=rest;ink=inkOf(layers)}}
 if(ink.n<30){return{err:'분석할 선화가 없어요. 마네킹을 보고 레이어에 먼저 스케치를 그려 주세요.'}}
 const hS=ink.y1-ink.y0;if(hS<30)return{err:'그림이 너무 작아요. 캔버스를 더 크게 사용해 인체 전체를 그려 주세요.'};
 /* 마네킹 실루엣 */
 const mw=480,mh=640,sc=document.createElement('canvas');sc.width=mw;sc.height=mh;const Qm=renderMan(sc,true);
 const sd=sc.getContext('2d').getImageData(0,0,mw,mh).data,sm=new Uint8Array(mw*mh);let a0=mw,b0=mh,a1=-1,b1=-1;
 for(let j=0;j<mh;j++)for(let i=0;i<mw;i++)if(sd[(j*mw+i)*4+3]>128){sm[j*mw+i]=1;if(i<a0)a0=i;if(i>a1)a1=i;if(j<b0)b0=j;if(j>b1)b1=j}
 const hM=b1-b0,N=120,EM=extents(sm,mw,{x0:a0,x1:a1,y0:b0,y1:b1},N),ES=extents(ink.m,ink.w,ink,N);
 const cxM=(a0+a1)/2,cxS=(ink.x0+ink.x1)/2,k=hS/hM;
 const tOf=y=>(y-b0)/hM;
 const T={head:tOf(Qm.head.y),neck:tOf(Qm.neck.y),sh:tOf((Qm.shL.y+Qm.shR.y)/2),hip:tOf((Qm.hpL.y+Qm.hpR.y)/2),knee:tOf((Qm.knL.y+Qm.knR.y)/2),ank:tOf((Qm.anL.y+Qm.anR.y)/2)};
 const headR=.5*Qm.head.s/hM;
 const flags=[];
 const wS=(ink.x1-ink.x0)/hS,wM=(a1-a0)/hM,ar=wS/wM;
 if(ar>1.3){mk('w','전체 폭이 마네킹보다 약 '+Math.round((ar-1)*100)+'% 넓어요. 팔·다리가 필요 이상 벌어졌거나 몸통이 두껍지 않은지 확인해 보세요.');}
 else if(ar<.75){mk('w','전체 폭이 마네킹보다 약 '+Math.round((1-ar)*100)+'% 좁아요. 팔이나 다리의 벌어짐/앞뒤 겹침이 빠졌는지 확인해 보세요.')}
 /* 머리 */
 const bh=(E,hh)=>band(E,T.head-headR*1.05,T.head+headR*1.05,N,hh);
 const hdS=bh(ES,hS),hdM=bh(EM,hM);
 if(hdS&&hdM){const r=hdS.w/hdM.w;if(r>1.3){mk('w','머리가 몸 대비 큰 편이에요 (마네킹의 약 '+r.toFixed(1)+'배). 머리 크기를 기준 단위로 전신 길이를 다시 재 보세요.',T.head);flags.push(T.head)}
  else if(r<.72){mk('w','머리가 몸 대비 작은 편이에요 (마네킹의 약 '+r.toFixed(1)+'배). 8등신 이하의 캐릭터가 아니라면 조금 키워 보세요.',T.head);flags.push(T.head)}}
 /* 어깨 폭 + 기울기 */
 const sb=(E,hh)=>band(E,T.sh-.025,T.sh+.03,N,hh);
 const shS=sb(ES,hS),shM=sb(EM,hM);
 if(shS&&shM){const r=shS.w/shM.w;if(r>1.35){mk('w','어깨~팔 폭이 넓어 보여요 (약 '+Math.round((r-1)*100)+'% 넓음). 상체가 과장되었는지 확인해 보세요.',T.sh);flags.push(T.sh)}
  else if(r<.7){mk('w','어깨 폭이 좁아요 (약 '+Math.round((1-r)*100)+'% 좁음). 머리 대비 어깨 너비(약 2배)를 확인해 보세요.',T.sh);flags.push(T.sh)}}
 const dxSh=Math.abs(Qm.shL.x-Qm.shR.x)/hM;
 if(dxSh>.12){const xs=[(Qm.shR.x-cxM)*k+cxS,(Qm.shL.x-cxM)*k+cxS],ys=[(Qm.shR.y-b0)*k+ink.y0,(Qm.shL.y-b0)*k+ink.y0];
  const win=hS*.06,top=[],y0=ys[0]-hS*.07,y1=Math.max(ys[0],ys[1])+hS*.07;
  const a=topInk(ink.m,ink.w,xs[0]-win,xs[0]+win,Math.min(ys[0],ys[1])-hS*.09,y1),b=topInk(ink.m,ink.w,xs[1]-win,xs[1]+win,Math.min(ys[0],ys[1])-hS*.09,y1);
  if(a!==null&&b!==null){const tiltS=(b-a)/hS,tiltM=(Qm.shL.y-Qm.shR.y)/hM;const df=tiltS-tiltM;
   if(Math.abs(df)>.03){mk('w','어깨 기울기가 마네킹과 달라요: 화면 '+(df>0?'오른쪽':'왼쪽')+' 어깨가 약 '+Math.round(Math.abs(df)*hS*AN)+'px 더 '+(df>0?'낮아':'높아')+' 보여요. 오른쪽 어깨의 기울기가 다소 '+(df>0?'낮습니다':'높습니다')+' 가이드와 비교해 보세요.',T.sh);flags.push(T.sh)}}}
 /* 상체/하체 폭 */
 const bands=[['상체(어깨~골반)',T.sh,T.hip],['허벅지',T.hip,T.knee],['종아리~발',T.knee,T.ank]];
 bands.forEach(([nm,a,b])=>{const s=band(ES,a,b,N,hS),m=band(EM,a,b,N,hM);if(s&&m){const r=s.mw/Math.max(.001,m.mw);
  if(r>1.4){mk('w',nm+' 부위가 마네킹보다 굵거나 넓게 그려졌어요 (약 '+Math.round((r-1)*100)+'%).',(a+b)/2);flags.push((a+b)/2)}
  else if(r<.62){mk('w',nm+' 부위가 마네킹보다 가늘게 그려졌어요 (약 '+Math.round((1-r)*100)+'%).',(a+b)/2);flags.push((a+b)/2)}}});
 /* 무게중심 → 상/하체 비율 */
 const cy=(E)=>{let s=0,wt=0;E.forEach((e,i)=>{if(e){const w=e[1]-e[0]+1;s+=i*w;wt+=w}});return s/Math.max(1,wt)/(N-1)};
 const dcy=cy(ES)-cy(EM);
 if(dcy<-.06){mk('w','무게가 위쪽(상체)에 쏠려 있어요. 머리 크기 대비 하체 비율(다리 길이)을 확인해 보세요 — 하체가 짧거나 가늘어 보일 수 있어요.',.7);flags.push(.7)}
 else if(dcy>.06){mk('w','무게가 아래쪽(하체)에 쏠려 있어요. 하체가 길거나 굵게 그려졌는지, 상체가 짧지 않은지 확인해 보세요.',.35);flags.push(.35)}
 /* 몸통 기울기: 머리 중심 vs 골반 중심 */
 const cH=(E,hh,box)=>band(E,T.head-headR,T.head+headR,N,hh),cP=(E,hh)=>band(E,T.hip-.03,T.hip+.03,N,hh);
 const hs=cH(ES,hS),ps=cP(ES,hS),hm=cH(EM,hM),pm=cP(EM,hM);
 if(hs&&ps&&hm&&pm){const ls=(hs.c-ps.c)/hS,lm=(hm.c-pm.c)/hM,df=ls-lm;if(Math.abs(df)>.06){mk('w','몸의 중심선이 달라요: 머리가 골반 위치보다 화면 '+(df>0?'오른쪽':'왼쪽')+'으로 가이드보다 더 치우쳐 있어요. 척추 기울기와 무게중심(서 있는 발 위치)을 확인해 보세요.',T.head);flags.push((T.head+T.hip)/2)}}
 /* 일치도 */
 let ds=0,dn=0;for(let i=0;i<N;i++){const s=ES[i],m=EM[i];const ws=s?(s[1]-s[0])/hS:0,wm=m?(m[1]-m[0])/hM:0;ds+=Math.abs(ws-wm);dn+=Math.max(wm,.02)}
 const score=Math.max(0,Math.round(100*(1-ds/dn)));
 if(!R.length)mk('g','큰 비율 문제는 발견되지 않았어요. 전체 비율이 마네킹 포즈와 잘 맞아요! 이제 디테일(손·발·옷 주름)에 집중해 보세요.');
 {let n=0;R.forEach(r=>{if(r.t!==undefined)r.n=++n})}
 /* 오버레이 데이터 (문서 좌표) */
 const mp=p=>[(p.x-cxM)*k+cxS,(p.y-b0)*k+ink.y0];const J2={};for(const n in Qm)J2[n]=mp(Qm[n]).map(v=>v*AN);
 const gc=document.createElement('canvas');gc.width=a1-a0+1;gc.height=hM+1;const gx=gc.getContext('2d');gx.drawImage(sc,-a0,-b0);gx.globalCompositeOperation='source-in';gx.fillStyle='#37e0ff';gx.fillRect(0,0,gc.width,gc.height);
 const g={J:J2,ghost:gc,gr:[(mp({x:a0,y:b0})[0])*AN,mp({x:a0,y:b0})[1]*AN,gc.width*k*AN,gc.height*k*AN],
  rows:R.filter(r=>r.n).map(r=>({y:(ink.y0+r.t*hS)*AN,x0:ink.x0*AN-40,x1:ink.x1*AN+40,n:r.n})),headR:headR*hS*AN};
 return{R,score,g}}
function runFb(){const o=analyze(),body=$('#fbBody');
 if(o.err){body.innerHTML='<span style="color:#ffd27a">'+o.err+'</span>';FB.g=null;FB.on=false;if(window.req)req();return}
 FB.g=o.g;FB.on=true;
 body.innerHTML='<div>포즈 일치도 <span class="sc">'+o.score+'</span><small style="color:var(--mu)"> / 100 (실루엣 기준 참고값)</small></div><ul style="list-style:none;padding:0;display:flex;flex-direction:column;gap:7px;margin:8px 0">'+o.R.map(r=>'<li class="'+r.sev+'">'+(r.n?'<b style="color:#ffd23f">['+r.n+']</b> ':'')+r.txt+'</li>').join('')+'</ul><small style="color:var(--mu)">캔버스의 청록 실루엣·뼈대는 마네킹을 그림 크기에 맞춰 겹친 가이드이고, 노란 점선 [번호]는 점검이 필요한 높이예요. 이 분석은 실루엣 비교라서 머리카락·옷·소품이 크면 오차가 생길 수 있어요.</small>';
 req()}
$('#fbRun').onclick=runFb;
$('#fbGhost').onclick=()=>{FB.ghost=!FB.ghost;$('#fbGhost').classList.toggle('on',FB.ghost);req()};
$('#fbBones').onclick=()=>{FB.bones=!FB.bones;$('#fbBones').classList.toggle('on',FB.bones);req()};
$('#fbOff').onclick=()=>{FB.on=false;req()};
const origOv=renderOverlays;
renderOverlays=function(v){origOv(v);if(!FB.on||!FB.g)return;const g=FB.g,z=S.zoom;v.save();
 if(FB.ghost){v.globalAlpha=.22;v.drawImage(g.ghost,g.gr[0],g.gr[1],g.gr[2],g.gr[3]);v.globalAlpha=1}
 if(FB.bones){const J=g.J,L=(a,b,c)=>{v.beginPath();v.moveTo(J[a][0],J[a][1]);v.lineTo(J[b][0],J[b][1]);v.strokeStyle=c;v.stroke()};v.lineWidth=3/z;v.lineCap='round';
  [['shL','shR','#fff'],['hpL','hpR','#fff'],['neck','pelvis','#fff'],['shL','elL','#6aa9ff'],['elL','wrL','#6aa9ff'],['wrL','hnL','#6aa9ff'],['shR','elR','#ff9a6a'],['elR','wrR','#ff9a6a'],['wrR','hnR','#ff9a6a'],
   ['hpL','knL','#6aa9ff'],['knL','anL','#6aa9ff'],['anL','toL','#6aa9ff'],['hpR','knR','#ff9a6a'],['knR','anR','#ff9a6a'],['anR','toR','#ff9a6a']].forEach(a=>L(...a));
  v.beginPath();v.arc(J.head[0],J.head[1],g.headR,0,7);v.strokeStyle='#fff';v.stroke();
  ['shL','shR','elL','elR','wrL','wrR','hpL','hpR','knL','knR','anL','anR','neck','pelvis'].forEach(n=>{v.beginPath();v.arc(J[n][0],J[n][1],5/z,0,7);v.fillStyle='#ff4f8b';v.fill()})}
 g.rows.forEach(r=>{v.setLineDash([10/z,7/z]);v.lineWidth=2/z;v.strokeStyle='#ffd23f';v.beginPath();v.moveTo(r.x0,r.y);v.lineTo(r.x1,r.y);v.stroke();v.setLineDash([]);
  v.beginPath();v.arc(r.x0,r.y,11/z,0,7);v.fillStyle='#ffd23f';v.fill();v.fillStyle='#000';v.font='bold '+(13/z)+'px sans-serif';v.textAlign='center';v.textBaseline='middle';v.fillText(r.n,r.x0,r.y)});
 v.restore()};

btnSync();
})();
</script>
